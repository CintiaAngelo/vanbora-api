spring:
  application:
    name: vanbora-api

  # Carrega o arquivo `.env` da pasta backend/ (ignorado pelo git) como fonte de
  # propriedades. É o que permite tirar senha do repositório sem obrigar cada dev
  # a configurar variáveis de ambiente na mão em cada IDE. `optional:` faz o
  # arquivo ser dispensável — em produção as variáveis vêm do ambiente.
  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vanbora?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:vanbora}
    # Sem default: uma senha de banco nunca deve ficar versionada no repositório.
    # Defina DB_PASSWORD no ambiente (veja .env.example e o README).
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Cita identificadores para evitar colisão com palavras reservadas
        # (ex.: role, text, position) em diferentes bancos.
        globally_quoted_identifiers: true
    show-sql: false

server:
  port: ${SERVER_PORT:8080}

# Configuração da API VanBora
vanbora:
  # "development" (default) ou "production". Em produção, a API se recusa a subir
  # se VANBORA_JWT_SECRET não tiver sido definido (ver SecurityStartupChecks).
  environment: ${VANBORA_ENV:development}
  jwt:
    # Em produção, defina VANBORA_JWT_SECRET com um valor forte (>= 32 caracteres).
    secret: ${VANBORA_JWT_SECRET:vanbora-dev-secret-change-me-please-0123456789-abcdefghij}
    expiration-millis: ${VANBORA_JWT_EXPIRATION:86400000}
  # Origens liberadas no CORS, separadas por vírgula. Em produção, defina com os
  # domínios reais (nunca curinga irrestrito combinado com credentials).
  cors:
    allowed-origins: ${VANBORA_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*,exp://*}
  login:
    # Proteção contra força bruta no login (ver LoginAttemptService).
    max-attempts: ${VANBORA_LOGIN_MAX_ATTEMPTS:5}
    lockout-minutes: ${VANBORA_LOGIN_LOCKOUT_MINUTES:15}
  # Rate limiting por IP (ver RateLimitFilter). Complementa o bloqueio por conta do
  # LoginAttemptService: aquele protege UMA conta, este protege a API como um todo
  # (ex.: password spraying, que tenta uma senha em milhares de contas diferentes).
  rate-limit:
    enabled: ${VANBORA_RATE_LIMIT_ENABLED:true}
    # Endpoints de autenticação (login, cadastro, login social): estreito.
    auth-requests-per-minute: ${VANBORA_RATE_LIMIT_AUTH:20}
    # Escritas autenticadas (POST/PUT/PATCH/DELETE).
    write-requests-per-minute: ${VANBORA_RATE_LIMIT_WRITE:120}
    # Demais requisições da API.
    default-requests-per-minute: ${VANBORA_RATE_LIMIT_DEFAULT:300}
    # Confie no cabeçalho X-Forwarded-For apenas se a API estiver atrás de um proxy
    # reverso confiável (nginx, ALB, Cloud Run). Ligado sem proxy, qualquer cliente
    # forja o próprio IP e escapa do limite.
    trust-forwarded-for: ${VANBORA_RATE_LIMIT_TRUST_PROXY:false}
  # Login social via Auth0 (Google e Facebook). Sem `domain` configurado o recurso
  # fica desligado e /api/auth/social responde 503 — o login por e-mail/senha segue
  # funcionando normalmente.
  #
  # Só há valores públicos aqui: domínio do tenant e client id do app nativo (PKCE,
  # aplicação pública). O client secret do Auth0 NÃO é usado nem deve ser colocado
  # em nenhum dos dois projetos.
  auth0:
    domain: ${AUTH0_DOMAIN:}
    # Audiences aceitas no id_token — normalmente o(s) client id(s) do app.
    audience: ${AUTH0_AUDIENCE:}
    # Cache das chaves públicas (JWKS) do Auth0.
    jwks-cache-minutes: ${AUTH0_JWKS_CACHE_MINUTES:60}
    # Validade do "ticket" de cadastro devolvido quando o e-mail social ainda não
    # tem conta no VanBora (o app completa o cadastro escolhendo o perfil).
    signup-ticket-minutes: ${AUTH0_SIGNUP_TICKET_MINUTES:30}
  # Popula dados de demonstração na primeira execução (banco vazio).
  seed-demo-data: ${VANBORA_SEED:true}
  # Link base usado nos e-mails (assinatura de contrato). Deep link do app por padrão.
  app:
    base-url: ${VANBORA_APP_BASE_URL:vanbora://app}
  # Armazenamento de imagens enviadas (fotos de perfil/ajudante), servidas em /uploads.
  uploads:
    dir: ${VANBORA_UPLOADS_DIR:uploads}
    public-path: /uploads
  # Roteamento real (rota seguindo ruas) via OpenRouteService — gratuito, free tier
  # 2000 req/dia. Sem chave configurada, a rota é desenhada em linha reta (fallback).
  # Crie uma chave grátis em https://openrouteservice.org/dev-dashboard.
  routing:
    ors:
      base-url: ${ORS_BASE_URL:https://api.openrouteservice.org}
      api-key: ${ORS_API_KEY:}
  # Gateway de pagamento: "simulated" (default) ou "mercadopago".
  payments:
    provider: ${VANBORA_PAYMENTS_PROVIDER:simulated}
    mercadopago:
      access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  # Taxas (frações; ex.: 0.05 = 5%). Fonte única do cálculo financeiro, também
  # exposta ao app em GET /api/config/fees. A taxa do gateway é ilustrativa
  # (crédito à vista) — confirme com o contrato do provedor antes de produção.
  fees:
    admin-monthly: ${VANBORA_FEE_ADMIN_MONTHLY:0.05}
    admin-annual: ${VANBORA_FEE_ADMIN_ANNUAL:0.04}
    gateway-rate: ${VANBORA_FEE_GATEWAY_RATE:0.0498}
    gateway-fixed: ${VANBORA_FEE_GATEWAY_FIXED:0.00}
    fidelity-months: ${VANBORA_FEE_FIDELITY_MONTHS:12}
    installment-fine: ${VANBORA_FEE_INSTALLMENT_FINE:0.50}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
